name: Triage de Issues con Claude

on:
  issues:
    types: [opened, edited, reopened]

# Si el issue se edita varias veces seguidas, solo interesa el analisis de la ultima version.
concurrency:
  group: triage-issue-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  triage:
    # No analizar issues creados por bots (p. ej. claude[bot]).
    if: github.event.issue.user.type != 'Bot'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write # necesario para sincronizar las labels con GITHUB_TOKEN
      id-token: write # necesario para la autenticacion OIDC de la App de Claude

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Sincronizar labels del proyecto
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jq -c '.[]' .github/labels.json | while read -r l; do
            gh label create "$(jq -r .name <<<"$l")" \
              --color "$(jq -r .color <<<"$l")" \
              --description "$(jq -r .description <<<"$l")" \
              --force
          done

      - name: Analizar issue con Claude
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}

          # El prompt vive en .claude/commands/triage-issue.md
          prompt: "/triage-issue REPO: ${{ github.repository }} ISSUE_NUMBER: ${{ github.event.issue.number }}"

          claude_args: >-
            --allowedTools "Read,Grep,Glob,Write,Bash(gh label list:*),Bash(gh issue view:*),Bash(gh issue edit:*),Bash(gh issue comment:*),Bash(gh api:*),Bash(gh search issues:*)"
